name: deploy-pages

on:
  push:
    # 海外站 Pages 部署在独立仓库（TokenFleet-AI/tokenfleet-landing-ai）。
    # 在目标仓库启用本 workflow 后，configure-pages 会自动适配其 origin / base_path。
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 只保留一次进行中的部署；不取消进行中的那次，避免部署到一半被打断。
concurrency:
  group: pages
  cancel-in-progress: false

# 本分支同时存在于代码仓库（tokenfleet-landing，Pages 属 cn 站）与海外站部署仓库
# （TokenFleet-AI/tokenfleet-landing-ai）。部署动作只允许在部署仓库运行 ——
# 否则 push main 到代码仓库会触发对 cn 站 Pages 的部署（实测 deploy job 会失败，但不可依赖）。
jobs:
  build:
    if: github.repository == 'TokenFleet-AI/tokenfleet-landing-ai'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 输出真实的 Pages origin / base_path（含之后可能配置的自定义域名），
      # 不靠猜仓库名，切自定义域名时 base_path 会自动变成空串。
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      # DEPLOY_TARGET 让 astro.config.mjs 切到 GitHub Pages 形态
      # （子路径 base + build.format: 'file'）；SITE_URL / BASE_PATH 覆盖默认值。
      - name: Build
        env:
          DEPLOY_TARGET: github-pages
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    if: github.repository == 'TokenFleet-AI/tokenfleet-landing-ai'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
